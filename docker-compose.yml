version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docchat-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - APP_ENV=production
      - ENVIRONMENT=production
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
    volumes:
      - docchat_chroma:/app/chroma_db
      - docchat_conversations:/app/conversations
      - docchat_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: docchat-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - DOCCHAT_BACKEND_URL=http://api:8001/api/chat/stream
    depends_on:
      api:
        condition: service_healthy

volumes:
  docchat_chroma:
    name: docchat_chroma_storage
  docchat_conversations:
    name: docchat_conversations_storage
  docchat_data:
    name: docchat_data_storage

