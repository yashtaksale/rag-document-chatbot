version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docchat-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - APP_ENV=production
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
    volumes:
      - docchat_chroma:/app/chroma_db
      - docchat_conversations:/app/conversations
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: docchat-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEXT_PUBLIC_API_URL=http://api:8001
    depends_on:
      api:
        condition: service_healthy

volumes:
  docchat_chroma:
    name: docchat_chroma_storage
  docchat_conversations:
    name: docchat_conversations_storage

